AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap: lets GitHub Actions in ONE repo assume an AWS role via OIDC (no long-lived keys).
  The role can only assume the CDK bootstrap roles (cdk-*), which do the actual deployment.
Parameters:
  GitHubOrg:
    Type: String
    Description: Your GitHub username or org (e.g. octocat)
  GitHubRepo:
    Type: String
    Default: hoa-brain
  GitHubEnvironment:
    Type: String
    Default: aws-demo
    Description: GitHub Environment name used by the deploy job
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this account already has the token.actions.githubusercontent.com provider
Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hoa-brain-github-actions
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:pull_request
      Policies:
        - PolicyName: AssumeCdkBootstrapRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-*
Outputs:
  RoleArn:
    Description: Put this in the GitHub repo variable AWS_ROLE_ARN
    Value: !GetAtt GitHubActionsRole.Arn
